name: Finalize release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable package version already approved on npm
        required: true
        type: string

permissions:
  contents: read

env:
  SMOQUE_RELEASE_VERSION: ${{ inputs.version }}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify public package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate release input
        run: |
          if [[ ! "$SMOQUE_RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release version must be a stable semantic version."
            exit 1
          fi

      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v${{ env.SMOQUE_RELEASE_VERSION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Set up release npm
        run: npm install --global --ignore-scripts npm@11.19.0

      - name: Verify signed release
        env:
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
        run: |
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import etc/release-signing-key.asc
          git fetch --no-tags origin main:refs/remotes/origin/main
          node scripts/release/verify-release.mts "v$SMOQUE_RELEASE_VERSION"

      - name: Verify public registry package
        id: package
        run: |
          node scripts/release/verify-registry.mts \
            "$SMOQUE_RELEASE_VERSION" \
            "$RUNNER_TEMP"

      - name: Smoke public registry tarball
        run: |
          node scripts/release/smoke-release-package.mts \
            "${{ steps.package.outputs.tarball }}" \
            "$SMOQUE_RELEASE_VERSION"

  # Only this job can write repository contents; it runs no repository scripts.
  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: github-release
    permissions:
      contents: write

    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v${{ env.SMOQUE_RELEASE_VERSION }}
          persist-credentials: false

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.SMOQUE_RELEASE_VERSION }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "smoque $TAG" \
            --notes-file "docs/releases/$TAG.md"
