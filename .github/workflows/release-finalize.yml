name: Finalize release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable package version already approved on npm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify public package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Set up release npm
        run: npm install --global npm@11.19.0

      - name: Verify signed release
        env:
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
        run: |
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import etc/release-signing-key.asc
          git fetch --no-tags origin main:refs/remotes/origin/main
          node scripts/release/verify-release.mts "v${{ inputs.version }}"

      - name: Verify public registry package
        id: package
        run: |
          node scripts/release/verify-registry.mts \
            "${{ inputs.version }}" \
            "$RUNNER_TEMP"

      - name: Smoke public registry tarball
        run: |
          node scripts/release/smoke-release-package.mts \
            "${{ steps.package.outputs.tarball }}" \
            "${{ inputs.version }}"

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: github-release
    permissions:
      contents: write

    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "smoque $TAG" \
            --notes-file "docs/releases/$TAG.md"
