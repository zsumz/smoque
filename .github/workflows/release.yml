name: Stage release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Set up release npm
        run: npm install --global npm@11.19.0

      - name: Verify signed release
        env:
          GNUPGHOME: ${{ runner.temp }}/release-gnupg
        run: |
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import etc/release-signing-key.asc
          git fetch --no-tags origin main:refs/remotes/origin/main
          node scripts/release/verify-release.mts "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Validate release
        run: npm run release:check

      - name: Pack release once
        id: package
        run: node scripts/release/pack-release.mts "$RUNNER_TEMP"

      - name: Smoke exact tarball
        run: |
          node scripts/release/smoke-release-package.mts \
            "${{ steps.package.outputs.tarball }}" \
            "${GITHUB_REF_NAME#v}"

      - name: Report artifact
        run: |
          echo "Tarball SHA-256: ${{ steps.package.outputs.sha256 }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve validated tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  stage:
    name: Stage validated package on npm
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-stage
    permissions:
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Set up release npm
        run: npm install --global npm@11.19.0

      - name: Download validated tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Stage package on npm
        run: |
          npm stage publish \
            "$RUNNER_TEMP/release/smoque-${GITHUB_REF_NAME#v}.tgz" \
            --tag latest \
            --access public
